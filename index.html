<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Lista-de-tarefas</title>
</head>
<body>
    <h1>Lista de Tarefas</h1>

    <label for="tarefa">Insira sua tarefa:</label>
    <input type="text" id="inputTarefa" placeholder="Insira uma tarefa" name="tarefa">
    <button class="adicionar" onclick="adicionarTarefa()">Adicionar Tarefa</button>
    <button class="limpar" id="btnLimparTudo" onclick="limparTarefa()" style="display: none; background-color: red; color: white;">
    Limpar Tudo
    </button>

    <p id="mensagem"></p>
    <ul id="lista"></ul>

    <script type="text/javascript" src="script2.js"></script>
    
</body>
</html>
